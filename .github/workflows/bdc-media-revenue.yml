name: BDC Media Revenue Agent CI
on:
  pull_request:
    paths:
      - 'agents/boxe-de-cria-media-revenue/**'
      - 'config/agents.json'
      - 'config/workflows.json'
      - '.github/workflows/bdc-media-revenue.yml'
  push:
    branches: [main]
    paths:
      - 'agents/boxe-de-cria-media-revenue/**'
      - 'config/agents.json'
      - 'config/workflows.json'
permissions:
  contents: read
jobs:
  test-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib only)
        run: python -m unittest discover -s agents/boxe-de-cria-media-revenue/tests -v
      - name: Offline smoke
        run: |
          cd agents/boxe-de-cria-media-revenue
          python runtime/bdc_media.py --db var/smoke.sqlite list
          python runtime/bdc_media.py finance --views 100000 --eligible 0.75 --rpm 5 --cost 350
