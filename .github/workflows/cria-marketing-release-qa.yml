name: CRIA Marketing Release QA
on:
  push:
    paths:
      - 'agents/satoshi-cria-growth-os/src/marketing_release_qa.py'
      - 'agents/satoshi-cria-growth-os/examples/fitbox_story_campaign.json'
      - 'agents/satoshi-cria-growth-os/tests/test_marketing_release_qa.py'
      - 'agents/satoshi-cria-growth-os/public_facts.json'
      - '.github/workflows/cria-marketing-release-qa.yml'
  pull_request:
    paths:
      - 'agents/satoshi-cria-growth-os/src/marketing_release_qa.py'
      - 'agents/satoshi-cria-growth-os/examples/fitbox_story_campaign.json'
      - 'agents/satoshi-cria-growth-os/tests/test_marketing_release_qa.py'
      - 'agents/satoshi-cria-growth-os/public_facts.json'
      - '.github/workflows/cria-marketing-release-qa.yml'
permissions:
  contents: read
jobs:
  creative-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s agents/satoshi-cria-growth-os/tests -p 'test_marketing_release_qa.py' -v
      - name: Draft preflight
        run: python agents/satoshi-cria-growth-os/src/marketing_release_qa.py --input agents/satoshi-cria-growth-os/examples/fitbox_story_campaign.json --gate draft
      - name: Block incomplete publication preflight
        run: |
          if python agents/satoshi-cria-growth-os/src/marketing_release_qa.py --input agents/satoshi-cria-growth-os/examples/fitbox_story_campaign.json --gate publish; then
            echo "ERROR: unverified artwork was accepted"
            exit 1
          else
            echo "PASS: publication blocked pending originals and human review"
          fi
